name: Deploy Emonphenom HQ

on:
  push:
    branches: [cursor/meridian-company-website-10e0, main, claude/agency-agents-repo-49vdhc]
    paths:
      - "website/**"
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Self-check forge engine
        run: node scripts/selfcheck.mjs
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /Agents/
      - name: Prepare Pages artifact
        run: |
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
